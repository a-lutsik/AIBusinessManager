openapi: 3.0.3
info:
  title: Cadence API
  version: 0.2.0
  description: >
    Public booking vs authenticated console. Domain errors are application/problem+json with a machine `code`.


    MASTER response policy (all /api/app/** responses, reads and writes): for every caller except the OWNER, each
    JSON property whose name contains price, amount, value, revenue, discount or minor (case-insensitive) is null at
    any depth - e.g. priceSnapshot, discountAmount, amountReceived, priceMinor, defaultPriceMinor, priceMinorOverride,
    completedValueMinor, package valueMinor. The key is kept and the value is null, never 0. A MASTER reads only
    their own specialist, matrix, schedule, visits and clients; any other id is 403 FORBIDDEN_RESOURCE.


    Client fields for a non-owner (same responses, by type, at any depth): a client object keeps only id and
    displayName; normalizedPhone, notes, tags, preferredLocale, telegramChatId, marketingConsent, firstVisitAt,
    lastVisitAt, completedVisitCount, noShowCount and lateCancelCount are null. A visit keeps clientDisplayName and
    trustLevel, while clientPhone and enteredName are null. A display name that shows a phone is null too (the
    client's phone in any formatting, a run of 7+ digits ending the client's phone, or any run of 9+ digits; spaces,
    dashes, dots and parentheses between digits are ignored). Trust keeps clientId, level, overrideLevel and the
    number-free reasonCodes (NEW_CLIENT, NO_SHOWS, LATE_CANCELLATIONS, REGULAR_CLIENT, RETURNING_CLIENT,
    OWNER_OVERRIDE); reasons (texts with salon-wide counts) and overrideReason (owner text) are null. A MASTER's
    clients are those with a non-cancelled visit with them that is not hidden from them; a cancelled visit gives no
    access to the client.


    Hidden phone bookings (clientHiddenFromMaster on a visit): a MASTER's booking by phone whose client is not
    already in the master's scope is created PENDING with clientHiddenFromMaster=true and an owner task
    MASTER_PHONE_BOOKING, the same for a matching existing client and for a new one. Until the OWNER confirms it
    (PENDING to CONFIRMED) every master read shows on that visit only the name the master typed: clientId, stored
    name, phone and trust are null, the visit detail and today view carry no trust and no packages, and the client
    stays out of the master's client list and card (403). A cancelled hidden visit stays hidden. The owner's
    confirmation reveals the master's other hidden visits with that client too and closes the task; a cancellation
    closes it as well. A cancelled visit (hidden or not) shows a master the same way: the visit stays on their
    calendar with the typed name only, no clientId, stored name, phone, trust or packages. Owner views are unchanged.
paths:
  /api/public/health:
    get:
      summary: Public health
      responses:
        "200":
          description: OK
  /api/public/tenants/{slug}:
    get:
      summary: Public tenant profile for booking page
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant
  /api/public/tenants/{slug}/services:
    get:
      summary: Public services
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Services
  /api/public/tenants/{slug}/services/{serviceId}/specialists:
    get:
      summary: Specialists who offer the service (matrix filter)
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: path
          name: serviceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Specialists
  /api/public/tenants/{slug}/slots:
    get:
      summary: Free slots only
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: query
          name: serviceId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: specialistId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Instant[]
        "429":
          description: Rate limited (problem+json, code RATE_LIMITED, Retry-After header in seconds)
  /api/public/tenants/{slug}/bookings:
    post:
      summary: Create public booking
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, specialistId, serviceStart, phone, name]
              properties:
                serviceId: { type: string, format: uuid }
                specialistId: { type: string, format: uuid }
                serviceStart: { type: string, format: date-time }
                phone: { type: string }
                name: { type: string }
                locale: { type: string }
                marketingConsent: { type: boolean }
                countryCode: { type: string }
      responses:
        "200":
          description: Booking created (CONFIRMED or PENDING)
        "409":
          description: Slot occupied or validation
        "429":
          description: Rate limited (problem+json, code RATE_LIMITED, Retry-After header in seconds)
  /api/public/bookings/{id}:
    get:
      summary: Read visit by opaque token
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: token
          required: true
          schema: { type: string }
      description: >
        Answers with the visit facts (id, specialistId, serviceId, status, serviceStart, serviceEnd,
        serviceNameSnapshot, priceSnapshot, currencyCode) and enteredName, the name typed at booking (for rows from
        before stage 03 that held "typed / stored", everything from the first " / " is dropped). Never the stored
        client name, phone or trust. The status still differs for a returning client when new clients need
        confirmation (accepted, rate-limited). The cancel and reschedule routes answer the same way.
      responses:
        "200": { description: "Visit facts and the typed name only" }
        "404": { description: Invalid token }
  /api/public/bookings/{id}/cancel:
    post:
      summary: Cancel by opaque token
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200": { description: "Cancelled visit: visit facts and the typed name only, as GET /api/public/bookings/{id}" }
  /api/public/bookings/{id}/reschedule:
    post:
      summary: Move the visit to another start by opaque token
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: token
          required: true
          schema: { type: string }
        - in: query
          name: start
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200": { description: "Moved visit: visit facts and the typed name only, as GET /api/public/bookings/{id}" }
        "403": { description: "TOKEN_INVALID - the token belongs to another visit" }
        "404": { description: "TOKEN_INVALID - unknown, revoked or expired token" }
        "409": { description: "Slot occupied or rule violation (problem+json with a machine code)" }
  /api/public/bookings/{id}/consent/withdraw:
    post:
      summary: Withdraw the client's marketing consent by the manage link
      description: >
        Sets the marketing consent of the client behind this visit to false (consent time and version
        "withdrawn:public-link"), audited as client.consent.withdraw. No marketing messages are sent yet, so it records
        the choice that later sends must honour. Idempotent.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200": { description: "{ id, marketingConsent: false }" }
        "403": { description: "TOKEN_INVALID - the token belongs to another visit; nothing is written" }
        "404": { description: "TOKEN_INVALID - unknown, revoked or expired token" }
  /api/public/bookings/{id}/calendar.ics:
    get:
      summary: Download .ics
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/calendar
  /api/app/health:
    get:
      summary: App health
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/app/me:
    get:
      summary: Current actor
      responses:
        "200": { description: Actor + tenant }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/app/dashboard:
    get:
      summary: Owner/master dashboard
      responses:
        "200": { description: "Dashboard. MASTER: only own visits, money fields null, no metrics, tasks or signals" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/app/masters/me/today:
    get:
      summary: Master's visits today with trust and packages (MASTER only)
      responses:
        "200": { description: "Own visits of the tenant day; visit money and package valueMinor are null (package name and sessions stay). A visit hidden from the master has trust null and no packages" }
        "403": { description: "FORBIDDEN_RESOURCE - caller is not a master" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/app/services:
    get:
      summary: Service catalog
      responses:
        "200": { description: "Services. MASTER: priceMinor is null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Create or update a service (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Service; an id that is null creates, a known id updates
              properties:
                id: { type: string, format: uuid, nullable: true }
                name: { type: string }
                description: { type: string, nullable: true }
                durationMinutes: { type: integer }
                priceMinor: { type: integer }
                bufferBeforeMinutes: { type: integer }
                bufferAfterMinutes: { type: integer }
                color: { type: string, nullable: true }
                active: { type: boolean }
                publicVisible: { type: boolean }
      responses:
        "200": { description: Saved service }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_RESOURCE - caller is not an owner" }
  /api/app/specialists:
    get:
      summary: Specialists (owner - all; MASTER - only their own record)
      responses:
        "200": { description: Specialists }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Create or update a specialist (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Specialist; an id that is null creates, a known id updates
              properties:
                id: { type: string, format: uuid, nullable: true }
                displayName: { type: string }
                keycloakUserId: { type: string, nullable: true }
                calendarColor: { type: string, nullable: true }
                active: { type: boolean }
      responses:
        "200": { description: Saved specialist }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_RESOURCE - caller is not an owner" }
  /api/app/specialists/{id}/matrix:
    get:
      summary: Services matrix of a specialist
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "Matrix rows. MASTER: defaultPriceMinor and priceMinorOverride are null" }
        "403": { description: "FORBIDDEN_RESOURCE - a master asked for another specialist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Create or update one service row of a specialist's matrix (owner only)
      description: The specialist is taken from the path; specialistId in the body is ignored.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, format: uuid, nullable: true }
                serviceId: { type: string, format: uuid }
                offered: { type: boolean }
                durationMinutesOverride: { type: integer, nullable: true }
                priceMinorOverride: { type: integer, nullable: true }
                bufferBeforeMinutesOverride: { type: integer, nullable: true }
                bufferAfterMinutesOverride: { type: integer, nullable: true }
      responses:
        "200": { description: Saved matrix row }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_RESOURCE - caller is not an owner" }
  /api/app/specialists/{id}/schedule:
    get:
      summary: Weekly schedule of a specialist
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Weekly intervals }
        "403": { description: "FORBIDDEN_RESOURCE - a master asked for another specialist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Replace the weekly schedule of a specialist (owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid, nullable: true }
                  weekday: { type: integer }
                  startMinute: { type: integer, description: Minutes from midnight }
                  endMinute: { type: integer, description: Minutes from midnight }
      responses:
        "200": { description: The weekly intervals after the replacement }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_RESOURCE - caller is not an owner" }
  /api/app/specialists/{id}/exceptions:
    put:
      summary: Create or update a schedule exception (day off or changed hours) of a specialist (owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The specialist is taken from the path; specialistId in the body is ignored.
              properties:
                id: { type: string, format: uuid, nullable: true }
                date: { type: string, format: date }
                kind: { type: string }
                startMinute: { type: integer, nullable: true }
                endMinute: { type: integer, nullable: true }
                note: { type: string, nullable: true }
      responses:
        "200": { description: Saved exception }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_RESOURCE - caller is not an owner" }
  /api/app/rules:
    get:
      summary: Tenant booking rules (owner only)
      responses:
        "200": { description: Booking rules }
        "403": { description: "FORBIDDEN_RESOURCE - caller is not an owner" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Save tenant booking rules (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slotStepMinutes: { type: integer }
                minNoticeMinutes: { type: integer }
                horizonDays: { type: integer }
                clientRescheduleAllowed: { type: boolean }
                lateCancellationHours: { type: integer }
                newClientRequiresConfirmation: { type: boolean }
                deductPackageOnNoShow: { type: boolean }
                weekStartsOn: { type: integer }
                timeFormat24h: { type: boolean }
      responses:
        "200": { description: Saved booking rules }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_RESOURCE - caller is not an owner" }
  /api/app/calendar:
    get:
      summary: Calendar visits
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: specialistId
          description: Ignored for a MASTER, who always gets their own visits
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "Visits. MASTER: own visits only, money fields null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/app/appointments/{id}:
    get:
      summary: Visit with the client's trust
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "Visit. MASTER: money fields null; trust null on a visit hidden from the master, whose client fields show only the typed name" }
        "403": { description: "FORBIDDEN_RESOURCE - a master asked for another specialist's visit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/app/appointments:
    post:
      summary: Create a console visit
      description: >
        OWNER may set statusOverride and skipNoticeAndHorizon (imports, back-dated entries). A MASTER books only for
        themselves under the tenant's rules: skipNoticeAndHorizon must be false, statusOverride null or PENDING, or
        CONFIRMED only when the client does not need confirmation; otherwise 403 FORBIDDEN_RESOURCE. A MASTER passing a
        clientId must have a non-cancelled, not hidden visit with that client, otherwise 403 FORBIDDEN_RESOURCE. When a
        MASTER books by phone, the response carries the displayName the master typed (or null) and null clientPhone,
        enteredName and trustLevel, so a matching existing client is not revealed; when that client is not already in
        the master's scope the visit is PENDING whatever statusOverride says, clientHiddenFromMaster is true and the
        owner gets a MASTER_PHONE_BOOKING task (see the hidden phone bookings note above). A phone match never replaces
        the stored name, never revokes marketing consent (true adds it with the new consent version) and sets the
        locale only when the client has none. The visit stores the typed name; the owner reads "typed / stored" in
        enteredName when they differ. No role creates a visit already COMPLETED or NO_SHOW whose serviceStart is in the
        future (409 VISIT_NOT_STARTED); back-dated settled entries stay possible.
      responses:
        "200": { description: "Created visit. MASTER: money fields null, client fields as typed" }
        "403": { description: "FORBIDDEN_RESOURCE - master booking for another specialist, bypassing the rules, or a clientId outside the master's clients" }
        "409": { description: "SLOT_OCCUPIED, MIN_NOTICE, BEYOND_HORIZON, VISIT_NOT_STARTED" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/app/appointments/{id}/transition:
    post:
      summary: Status machine transition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: to
          required: true
          schema:
            type: string
            enum: [PENDING, CONFIRMED, COMPLETED, NO_SHOW, CANCELLED_BY_CLIENT, CANCELLED_BY_BUSINESS]
        - in: query
          name: note
          required: false
          schema: { type: string }
      responses:
        "200": { description: Updated visit }
        "403": { description: "FORBIDDEN_RESOURCE - master on another specialist's visit, or confirming a visit of a client who needs the owner's confirmation" }
        "409": { description: "INVALID_TRANSITION, or VISIT_NOT_STARTED - COMPLETED or NO_SHOW before serviceStart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      description: >
        COMPLETED and NO_SHOW are reachable only once the visit has started (serviceStart not in the future), for every
        role including the owner; earlier attempts get 409 VISIT_NOT_STARTED.
        NO_SHOW to COMPLETED and COMPLETED to NO_SHOW are owner corrections: they also adjust the client's counters
        and are audited as appointment.status_correction. A master gets 403 FORBIDDEN_RESOURCE.
        A master also gets 403 FORBIDDEN_RESOURCE for PENDING to CONFIRMED when the client still needs confirmation
        (the same rule as statusOverride=CONFIRMED on create) or the visit is hidden from the master; the owner confirms
        such visits, and the owner's confirmation clears clientHiddenFromMaster (a cancellation keeps it).
        A correction of a row settled before its start (data from before this rule) is refused with 409
        VISIT_NOT_STARTED and a message saying so; it can be corrected once the visit has started.
  /api/app/appointments/{id}/access-link:
    post:
      summary: Issue a fresh client manage link (owner only)
      description: >
        Mints a new 256-bit booking token on every call and returns the manage path once. Only the SHA-256 hash is
        stored; the raw token cannot be retrieved later. Owner tasks carry the {manageLink} placeholder instead.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Manage link valid for 365 days
          content:
            application/json:
              schema:
                type: object
                required: [managePath, expiresAt]
                properties:
                  managePath: { type: string, example: "/b/3f2b1c1e-0000-4000-8000-000000000000?token=..." }
                  expiresAt: { type: string, format: date-time }
        "403": { description: "FORBIDDEN_RESOURCE - caller is not an owner" }
        "404": { description: "APPOINTMENT_NOT_FOUND - no such visit in the current tenant" }
        "409": { description: "APPOINTMENT_CANCELLED - cancelled visits cannot be managed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/app/appointments/{id}/reschedule:
    post:
      summary: Move a visit to another start
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: start
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200": { description: Updated visit }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_RESOURCE - master on another specialist's visit" }
        "409": { description: "Slot occupied or rule violation (problem+json with a machine code)" }
  /api/app/clients:
    get:
      summary: Search clients
      responses:
        "200": { description: "Clients. MASTER: only clients with a non-cancelled, not hidden visit with them, id and displayName only; q matches the name only, never the phone; a q with 3 or more digits finds nothing and clients whose name shows a phone are left out" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/app/clients/{id}:
    get:
      summary: Client card with trust and full visit history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "Card. MASTER: client id and displayName, trust (level, overrideLevel, reasonCodes), history only of their non-cancelled, not hidden visits; other client fields and money null" }
        "403": { description: "FORBIDDEN_RESOURCE - a master asked for a client without a non-cancelled, not hidden visit with them" }
        "404": { description: "NOT_FOUND - no such client in the current tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/app/clients/{id}/consent/withdraw:
    post:
      summary: Withdraw a client's marketing consent on their request (owner only)
      description: >
        Sets marketing consent to false (consent version "withdrawn:owner"), audited as client.consent.withdraw.
        Bookings never revoke consent (a phone match may only add it), so this and the manage link are the ways back.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Updated client }
        "403": { description: "FORBIDDEN_RESOURCE - caller is not an owner" }
        "404": { description: "CLIENT_NOT_FOUND" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/app/clients/{id}/merge:
    post:
      summary: Merge a duplicate client into this one (owner only)
      description: >
        Moves the absorbed client's visits, packages and owner tasks to the surviving client and adds its counters
        (completed visits, no-shows, late cancellations, completed value). First/last visit become the earliest/latest,
        notes are appended under a separator naming the absorbed client, tags are united. The survivor's marketing
        consent is not changed. The absorbed profile is anonymized and keeps merged_into_client_id. Atomic.
      parameters:
        - in: path
          name: id
          required: true
          description: Surviving client
          schema: { type: string, format: uuid }
        - in: query
          name: absorbedId
          required: true
          description: Duplicate client that is absorbed
          schema: { type: string, format: uuid }
      responses:
        "200": { description: The updated surviving client }
        "400": { description: "INVALID_MERGE - a client cannot be merged with itself" }
        "403": { description: "FORBIDDEN_RESOURCE - caller is not an owner" }
        "404": { description: "CLIENT_NOT_FOUND - no such client in the current tenant" }
        "409": { description: "CLIENT_ALREADY_MERGED - the absorbed client is already anonymized or merged" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/app/clients/{id}/trust:
    post:
      summary: Override the trust level of a client (owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: level
          required: true
          schema: { type: string }
        - in: query
          name: reason
          required: true
