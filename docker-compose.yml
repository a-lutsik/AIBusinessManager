services:
  timescaledb:
    image: timescale/timescaledb:2.30.0-pg16
    container_name: cadence-timescaledb
    environment:
      POSTGRES_DB: cadence
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: cadence-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./docker/keycloak/realm-cadence.json:/opt/keycloak/data/import/realm-cadence.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Optional app container — build when Dockerfile exists; prefer local ./gradlew bootRun for day-to-day.
  # app:
  #   build: ./backend
  #   depends_on:
  #     timescaledb:
  #       condition: service_healthy
  #     keycloak:
  #       condition: service_started
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/cadence
  #     SPRING_DATASOURCE_USERNAME: cadence
  #     SPRING_DATASOURCE_PASSWORD: cadence
  #     APP_SECURITY_OAUTH2_ENABLED: "true"
  #     SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8081/realms/cadence

volumes:
  timescaledb_data:
