# Static host of the web export (TD-57). TLS ends at the reverse proxy in front; this listens on plain HTTP.
# The rules are those of frontend/scripts/e2e-serve.mjs: an exact file or <path>.html, the [param] file of a dynamic route,
# +not-found.html with status 404 when nothing matches. scripts/web-host-check.sh runs them against this image.

# The path alone: a manage link carries its token in the query string, which must never reach a log.
map $request_uri $cadence_path {
    "~^([^?]*)" $1;
    default     "-";
}
log_format cadence '$remote_addr [$time_local] "$request_method $cadence_path" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    access_log /var/log/nginx/access.log cadence;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_page 404 /+not-found.html;
    include /etc/nginx/cadence/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Bundles and assets carry a content hash in their names.
    location /_expo/static/ {
        include /etc/nginx/cadence/hashed-headers.conf;
        try_files $uri =404;
    }
    location /assets/ {
        include /etc/nginx/cadence/hashed-headers.conf;
        try_files $uri =404;
    }

    location = /+not-found.html {
        internal;
        include /etc/nginx/cadence/html-headers.conf;
    }

    # Dynamic routes: the page reads the value from the URL in the browser.
    location ~ ^/book/[^/]+/?$ {
        include /etc/nginx/cadence/html-headers.conf;
        try_files "/book/[slug].html" =404;
    }
    location ~ ^/b/[^/]+/?$ {
        include /etc/nginx/cadence/html-headers.conf;
        try_files "/b/[id].html" =404;
    }
    location ~ ^/clients/[^/]+/?$ {
        include /etc/nginx/cadence/html-headers.conf;
        try_files "/clients/[id].html" =404;
    }
    location ~ ^/specialists/[^/]+/?$ {
        include /etc/nginx/cadence/html-headers.conf;
        try_files "/specialists/[id].html" =404;
    }

    # The export also writes route groups and the dev sitemap; neither is a URL of the app, and dotfiles never are.
    location ~ ^/(\(|_sitemap|\.) {
        return 404;
    }

    # A page with a slash at the end is the same page.
    location ~ ^(?<cadence_page>/.+)/$ {
        include /etc/nginx/cadence/html-headers.conf;
        try_files $cadence_page.html =404;
    }

    location = / {
        include /etc/nginx/cadence/html-headers.conf;
        try_files /index.html =404;
    }
    location / {
        include /etc/nginx/cadence/html-headers.conf;
        try_files $uri $uri.html =404;
    }
}
